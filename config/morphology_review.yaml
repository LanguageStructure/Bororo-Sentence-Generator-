# Human-reviewed Bororo morphology.
# Analyses below are supplied/reviewed by the linguist. Corpus-derived evidence
# remains a separate layer. Approval never licenses unlisted forms or cells.
lemmas:
  ako:
    status: partial
    lexical_meaning: "voz, som, fala"
    gloss_note: "ako = voz/som/fala; inago = minha fala; ego = fala deles"
    note: >
      Partial analysis cross-checked against the author's Bororo grammar draft.
      Bound indexes are clitics used across possessors, core/oblique arguments
      and postpositions. Do not infer automatic interchangeability from shared FEATS.
    grammar_review:
      status: reviewed
      source: "Bororo grammar draft, 2026-09-16"
      bound_index_inventory:
        "1SG": "i="
        "2SG": "a="
        "3SG": ["u=", "zero"]
        "1PL.INCL": "pa="
        "1PL.EXCL": "ce="
        "2PL": "ta="
        "3PL": "e="
        "CORF": "tu="
        "RECP": "pu="
      stem_class_system:
        status: reviewed
        classes: ["C", "U", "O", "N", "I"]
        source_section: "4.4.1.2"
        note: >
          C/U are consonant-initial classes; O/N/I are vowel-initial classes
          distinguished by person-index allomorphy. Class assignment is lexical
          evidence and must never be guessed from spelling alone.
      morphophonology_note: >
        Person indexes have paradigmatic allomorphy; consonantal alternants occur
        before vowel-initial stems. Surface forms such as akago/pagago/tagago
        therefore must not be generalized by literal string concatenation.
      ako_stem_class:
        status: unresolved
        note: >
          Do not assign ako mechanically to O/N/I. The reviewed surface paradigm
          must be reconciled with the grammar's stem-class analysis first.
      re_note: >
        -re marks declarative/indicative illocutionary force and is not a realis marker.
        It can co-occur with irrealis -modu.
      ka_note: >
        In finite declaratives -ka is negative; attested ordering with irrealis is
        ROOT-modu-ka-re.
      do_note: >
        -do participates in causative morphology and also in positive imperative
        constructions with monovalent predicates; these uses remain context-sensitive.
    morphemes:
      "i(n)-":
        analysis: "1SG"
        status: reviewed
      "a(k)-":
        analysis: "2SG"
        status: reviewed
      "pa(g)-":
        analysis: "1PL.INCL"
        status: reviewed
      "ta(g)-":
        analysis: "2PL"
        status: reviewed
      "ce-":
        analysis: "1PL.EXCL"
        status: reviewed
      "e-":
        analysis: "3PL"
        status: reviewed
      "-ka":
        analysis: "NEG"
        status: reviewed
      "-re":
        analysis: "IND"
        status: reviewed
      "-modu":
        analysis: "IRR"
        status: reviewed
      "-do":
        analysis: "CAUS or IMP"
        status: reviewed_ambiguous
    analyzed_forms:
      tagago:
        segmentation: "ta(g)-ako"
        analysis: ["2PL", "ako"]
        status: reviewed
      akago:
        segmentation: "a(k)-ako"
        analysis: ["2SG", "ako"]
        status: reviewed
      akagore:
        segmentation: "a(k)-ako-re"
        analysis: ["2SG", "ako", "IND"]
        status: reviewed
      pagago:
        segmentation: "pa(g)-ako"
        analysis: ["1PL.INCL", "ako"]
        status: reviewed
      pagagore:
        segmentation: "pa(g)-ako-re"
        analysis: ["1PL.INCL", "ako", "IND"]
        status: reviewed
      inagokare:
        segmentation: "i(n)-ako-ka-re"
        analysis: ["1SG", "ako", "NEG", "IND"]
        status: reviewed
        annotation_note: "Current corpus FEATS omit Polarity=Neg."
      cenagore:
        segmentation: "ce-n-ako-re"
        analysis: ["1PL.EXCL", "ako", "IND"]
        status: reviewed
      akodo:
        segmentation: "ako-do"
        analysis: ["ako", "CAUS_or_IMP"]
        status: reviewed_ambiguous
      akomode:
        segmentation: "ako-modu-re"
        analysis: ["ako", "IRR", "IND"]
        status: reviewed
      inago:
        segmentation: "i(n)-ako"
        analysis: ["1SG", "ako"]
        meaning: "minha fala"
        usage: "nominal_possessive"
        status: reviewed
      ego:
        segmentation: "e-ako"
        analysis: ["3PL", "ako"]
        meaning: "fala deles"
        usage: "nominal_possessive"
        status: reviewed
    approved_cells:
      - feats: {Mood: Ind, Number: Sing, Person: 1}
        form: inagore
        evidence_count: 96
      - feats: {Mood: Ind, Number: Sing, Person: 3}
        form: akore
        evidence_count: 52
      - feats: {Mood: Ind, Number: Plur, Person: 3}
        form: egore
        evidence_count: 84
    review_required_forms: []

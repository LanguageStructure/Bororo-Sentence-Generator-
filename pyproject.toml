[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="bororo-sentence-generator"
version="0.1.0"
description="Corpus-grounded experimental sentence generator for Boe-Bororo"
requires-python=">=3.9"
dependencies=["conllu>=6.0","PyYAML>=6.0"]
[project.optional-dependencies]
test=["pytest>=8.0"]
[project.scripts]
bororo-patterns="bororo_generator.cli:main"
[tool.setuptools.packages.find]
where=["src"]
